<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De'Kodao Agencies - Receipt & Invoice Generator</title>
    <link rel="icon" href="logo.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-section">
                <img src="logo.jpeg" alt="De'Kodao Agencies Logo" class="logo" id="companyLogo">
            </div>
            <h1>DE'KODAO AGENCIES</h1>
            <div class="subtitle">Travel Beyond Expectations</div>
        </div>

        <div class="content">

            <!-- Document Type -->
            <div class="document-type">
                <button class="doc-type-btn active" onclick="selectDocType('receipt', this)">Receipt</button>
                <button class="doc-type-btn" onclick="selectDocType('invoice', this)">Invoice</button>
            </div>

            <!-- Currency Selector -->
            <div class="currency-selector">
                <span class="currency-label">Currency:</span>
                <div class="currency-options">
                    <button class="currency-btn active" id="btn-usd" onclick="selectCurrency('USD', this)">
                        <span class="currency-flag">🇺🇸</span> USD ($)
                    </button>
                    <button class="currency-btn" id="btn-ksh" onclick="selectCurrency('KSH', this)">
                        <span class="currency-flag">🇰🇪</span> KSH (Ksh)
                    </button>
                </div>
            </div>

            <!-- Document Details -->
            <div class="form-section">
                <h2>Document Details</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Document Number *</label>
                        <input type="text" id="docNumber" placeholder="e.g., RCP-001 or INV-001" required>
                    </div>
                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="docDate" required>
                    </div>
                </div>
                <div class="form-row" id="invoiceDueDate" style="display: none;">
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="dueDate">
                    </div>
                    <div class="form-group"></div>
                </div>
            </div>

            <!-- Customer Information -->
            <div class="form-section">
                <h2>Customer Information</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Customer Name *</label>
                        <input type="text" id="customerName" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="customerPhone" placeholder="+254...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full">
                        <label>Address</label>
                        <textarea id="customerAddress" placeholder="Customer address (optional)"></textarea>
                    </div>
                </div>
            </div>

            <!-- Items / Services -->
            <div class="form-section">
                <h2>Items / Services</h2>
                <div class="items-section">
                    <div class="item-header">
                        <div>Description</div>
                        <div>Quantity</div>
                        <div class="price-col-header">Price (<span id="headerCurrency">USD</span>)</div>
                        <div class="price-col-header">Total (<span id="headerCurrencyTotal">USD</span>)</div>
                        <div></div>
                    </div>
                    <div id="itemsContainer">
                        <div class="item-row">
                            <div class="form-group">
                                <input type="text" class="item-desc" placeholder="Item/service description" required>
                            </div>
                            <div class="form-group">
                                <input type="number" class="item-qty" value="1" min="1" step="1">
                            </div>
                            <div class="form-group">
                                <input type="number" class="item-price" value="0" min="0" step="0.01">
                            </div>
                            <div class="form-group">
                                <input type="number" class="item-total" value="0" readonly>
                            </div>
                            <button class="remove-btn" onclick="removeItem(this)" style="visibility: hidden;">×</button>
                        </div>
                    </div>
                    <button class="add-item-btn" onclick="addItem()">Add Item</button>
                </div>

                <div class="totals-section">
                    <div class="total-row grand-total-row">
                        <div class="total-label">TOTAL:</div>
                        <div class="total-value" id="grandTotal">$0.00</div>
                    </div>
                </div>
            </div>

            <button class="generate-btn" onclick="generatePDF()">Generate PDF</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
